name: CD - Auth - Deploy Terraform

on:
  workflow_call:
    inputs:
      branch-name:
        description: "Branch do backend que disparou o deploy"
        required: true
        type: string
      backend-repo:
        description: "owner/repo do backend (ex: vyracare/vyracare-api-authentication)"
        required: true
        type: string
      project-path:
        description: "Caminho do .csproj no repo do backend"
        required: true
        type: string
      output-dir:
        description: "Diretório de saída do publish (relativo ao workspace do job)"
        required: false
        default: backend-publish
        type: string
    secrets:
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_REGION: { required: false }
      PAT_TOKEN: { required: true }

jobs:
  deploy-terraform:
    runs-on: ubuntu-latest
    # ✅ Apenas UM bloco env no nível do job
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Resolve checkout ref
        id: resolve_checkout_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-infra-pipes-dot-net',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} not found in vyracare/vyracare-infra-pipes-dot-net. Falling back to default branch.`);
                core.setOutput('ref', '');
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout Infra (branch)
        if: steps.resolve_checkout_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          ref: ${{ steps.resolve_checkout_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Infra (default)
        if: steps.resolve_checkout_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Backend at ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs['backend-repo'] }}
          ref: ${{ inputs['branch-name'] }}
          token: ${{ secrets.PAT_TOKEN }}
          path: backend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "backend/${{ inputs['project-path'] }}"

      - name: Build
        run: dotnet build "backend/${{ inputs['project-path'] }}" -c Release --no-restore

      - name: Publish (linux-x64)
        run: |
          mkdir -p "${{ inputs['output-dir'] }}"
          dotnet publish "backend/${{ inputs['project-path'] }}" -c Release -r linux-x64 --self-contained false -o "${{ inputs['output-dir'] }}"

      - name: Export publish dir to TF_VAR
        run: echo "TF_VAR_lambda_source_dir=${GITHUB_WORKSPACE}/${{ inputs['output-dir'] }}" >> $GITHUB_ENV


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.2

      - name: Terraform Init
        working-directory: ./infra-repo/infra
        run: terraform init

      - name: Detect existing infra and prepare destroy
        working-directory: ./infra-repo/infra
        run: |
          set -euo pipefail

          destroy_needed="false"
          state_list="$(terraform state list 2>/dev/null || true)"
          state_has() {
            echo "$state_list" | grep -qx "$1"
          }
          api_name="vyracare-api-${TF_VAR_env_suffix:-dev}"
          api_id=$(aws apigatewayv2 get-apis --query "Items[?Name=='${api_name}'].ApiId | [0]" --output text)

          if [ -n "$api_id" ] && [ "$api_id" != "None" ]; then
            destroy_needed="true"
            if ! state_has "aws_apigatewayv2_api.http_api"; then
              terraform import aws_apigatewayv2_api.http_api "$api_id" || true
            fi
          fi

          lambda_name="${TF_VAR_lambda_function_name:-vyracare-auth-dev}"
          if aws lambda get-function --function-name "$lambda_name" >/dev/null 2>&1; then
            destroy_needed="true"
            if ! state_has "aws_lambda_function.auth_api"; then
              terraform import aws_lambda_function.auth_api "$lambda_name" || true
            fi
            if aws lambda get-alias --function-name "$lambda_name" --name "live" >/dev/null 2>&1; then
              if ! state_has "aws_lambda_alias.auth_api_live"; then
                terraform import aws_lambda_alias.auth_api_live "$lambda_name/live" || true
              fi
            fi
          fi

          log_group_name="/aws/lambda/${lambda_name}"
          if aws logs describe-log-groups --log-group-name-prefix "$log_group_name" --query "logGroups[?logGroupName=='${log_group_name}'].logGroupName | [0]" --output text | grep -qx "$log_group_name"; then
            destroy_needed="true"
            if ! state_has "aws_cloudwatch_log_group.lambda_logs"; then
              terraform import aws_cloudwatch_log_group.lambda_logs "$log_group_name" || true
            fi
          fi

          if [ "$destroy_needed" = "true" ]; then
            echo "DESTROY_INFRA=true" >> $GITHUB_ENV
          else
            echo "DESTROY_INFRA=false" >> $GITHUB_ENV
          fi

      - name: Terraform Destroy (Gateway + Lambda)
        if: env.DESTROY_INFRA == 'true'
        working-directory: ./infra-repo/infra
        run: |
          targets=$(terraform state list | grep -E '^(aws_apigatewayv2_|aws_lambda_|aws_cloudwatch_log_group\\.lambda_logs$|aws_iam_role\\.lambda_exec$|aws_iam_role_policy_attachment\\.lambda_logs$)' || true)
          if [ -z "$targets" ]; then
            echo "No gateway/lambda resources found in state."
            exit 0
          fi
          args=()
          while read -r t; do
            args+=("-target=$t")
          done <<< "$targets"
          terraform destroy -auto-approve "${args[@]}"


      - name: Terraform Plan
        working-directory: ./infra-repo/infra
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra-repo/infra
        run: terraform apply -auto-approve tfplan

      - name: Export API Gateway URL
        working-directory: ./infra-repo/infra
        run: |
          set -euo pipefail
          api_url=$(terraform output -raw api_gateway_url)
          api_id=$(echo "$api_url" | sed -E 's#https://([^.]*)\\.execute-api\\..*#\\1#')
          echo "API_GATEWAY_URL=$api_url" >> $GITHUB_ENV
          echo "API_GATEWAY_ID=$api_id" >> $GITHUB_ENV

      - name: Resolve app-shell ref
        id: resolve_app_shell_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-app-shell',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} not found in vyracare/vyracare-app-shell. Falling back to default branch.`);
                core.setOutput('ref', '');
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout App Shell (branch)
        if: steps.resolve_app_shell_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-shell
          ref: ${{ steps.resolve_app_shell_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: app-shell

      - name: Checkout App Shell (default)
        if: steps.resolve_app_shell_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-shell
          token: ${{ secrets.PAT_TOKEN }}
          path: app-shell

      - name: Resolve app-user-mfe ref
        id: resolve_app_user_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-app-user-mfe',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} not found in vyracare/vyracare-app-user-mfe. Falling back to default branch.`);
                core.setOutput('ref', '');
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout App User MFE (branch)
        if: steps.resolve_app_user_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-user-mfe
          ref: ${{ steps.resolve_app_user_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: app-user-mfe

      - name: Checkout App User MFE (default)
        if: steps.resolve_app_user_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-user-mfe
          token: ${{ secrets.PAT_TOKEN }}
          path: app-user-mfe

      - name: Update App Shell apiUrl
        working-directory: ./app-shell
        run: |
          set -euo pipefail
          api_url="${API_GATEWAY_URL}/api/auth"
          api_id="${API_GATEWAY_ID}"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          api_url = os.environ["API_GATEWAY_URL"].rstrip("/") + "/api/auth"
          api_id = os.environ["API_GATEWAY_ID"]

          def update(path: str) -> None:
            p = Path(path)
            if not p.exists():
              return
            text = p.read_text()
            text = re.sub(r"apiUrl:\\s*'[^']*'", f"apiUrl: '{api_url}'", text)
            text = re.sub(r'api_id:\\s*\"[^\"]*\"', f'api_id: \"{api_id}\"', text)
            p.write_text(text)

          update("src/environments/environments.ts")
          update("src/environments/environments.prod.ts")
          PY

          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/environments/environments.ts src/environments/environments.prod.ts
            git commit -m "chore: update auth api url"
            git push
          else
            echo "App Shell already up to date."
          fi

      - name: Update App User MFE apiUrl
        working-directory: ./app-user-mfe
        run: |
          set -euo pipefail
          api_url="${API_GATEWAY_URL}/api/auth"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          api_url = os.environ["API_GATEWAY_URL"].rstrip("/") + "/api/auth"
          p = Path("src/environments/environments.ts")
          if p.exists():
            text = p.read_text()
            text = re.sub(r"apiUrl:\\s*'[^']*'", f"apiUrl: '{api_url}'", text)
            p.write_text(text)
          PY

          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/environments/environments.ts
            git commit -m "chore: update auth api url"
            git push
          else
            echo "App User MFE already up to date."
          fi
