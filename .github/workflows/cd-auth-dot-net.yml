name: CD - Auth - Deploy Terraform

on:
  workflow_call:
    inputs:
      branch-name:
        description: "Branch do backend que disparou o deploy"
        required: true
        type: string
      backend-repo:
        description: "owner/repo do backend (ex: vyracare/vyracare-api-authentication)"
        required: true
        type: string
      project-path:
        description: "Caminho do .csproj no repo do backend"
        required: true
        type: string
      output-dir:
        description: "Diretório de saída do publish (relativo ao workspace do job)"
        required: false
        default: backend-publish
        type: string
    secrets:
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_REGION: { required: false }
      PAT_TOKEN: { required: true }

jobs:
  deploy-terraform:
    runs-on: ubuntu-latest
    # ✅ Apenas UM bloco env no nível do job
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Resolve checkout ref
        id: resolve_checkout_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-infra-pipes-dot-net',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} not found in vyracare/vyracare-infra-pipes-dot-net. Falling back to default branch.`);
                core.setOutput('ref', '');
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout Infra (branch)
        if: steps.resolve_checkout_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          ref: ${{ steps.resolve_checkout_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Infra (default)
        if: steps.resolve_checkout_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Backend at ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs['backend-repo'] }}
          ref: ${{ inputs['branch-name'] }}
          token: ${{ secrets.PAT_TOKEN }}
          path: backend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "backend/${{ inputs['project-path'] }}"

      - name: Build
        run: dotnet build "backend/${{ inputs['project-path'] }}" -c Release --no-restore

      - name: Publish (linux-x64)
        run: |
          mkdir -p "${{ inputs['output-dir'] }}"
          dotnet publish "backend/${{ inputs['project-path'] }}" -c Release -r linux-x64 --self-contained false -o "${{ inputs['output-dir'] }}"

      - name: Resolve deployment context
        shell: bash
        run: |
          set -euo pipefail

          branch_name="${{ inputs['branch-name'] }}"

          if [ "$branch_name" = "main" ]; then
            env_suffix="prod"
            resource_suffix=""
            mongo_database="vyracare_db"
            mongo_secret_name="vyracare/shared/mongo-prod"
            jwt_secret_name="vyracare/shared/jwt-signing-prod"
          elif [ "$branch_name" = "release" ] || [[ "$branch_name" == release/* ]]; then
            env_suffix="hml"
            resource_suffix="-hml"
            mongo_database="vyracare_db_hml"
            mongo_secret_name="vyracare/shared/mongo-hml"
            jwt_secret_name="vyracare/shared/jwt-signing-hml"
          else
            env_suffix="dev"
            resource_suffix="-dev"
            mongo_database="vyracare_db_dev"
            mongo_secret_name="vyracare/shared/mongo-dev"
            jwt_secret_name="vyracare/shared/jwt-signing-dev"
          fi

          echo "TF_VAR_env_suffix=${env_suffix}" >> $GITHUB_ENV
          echo "TF_VAR_lambda_function_name=vyracare-api-authentication${resource_suffix}" >> $GITHUB_ENV
          echo "TF_VAR_lambda_environment_variables={\"Mongo__Database\":\"${mongo_database}\",\"MONGO_SECRET_NAME\":\"${mongo_secret_name}\",\"JWT_SECRET_NAME\":\"${jwt_secret_name}\"}" >> $GITHUB_ENV

      - name: Export publish dir to TF_VAR
        run: echo "TF_VAR_lambda_source_dir=${GITHUB_WORKSPACE}/${{ inputs['output-dir'] }}" >> $GITHUB_ENV


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.2

      - name: Reset local Terraform state
        working-directory: ./infra-repo/infra
        run: |
          rm -f terraform.tfstate terraform.tfstate.backup

      - name: Terraform Init
        working-directory: ./infra-repo/infra
        run: terraform init

      - name: Import existing infra into state
        working-directory: ./infra-repo/infra
        run: |
          set -euo pipefail

          state_list="$(terraform state list 2>/dev/null || true)"
          state_has() {
            echo "$state_list" | grep -qx "$1"
          }
          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if [ -z "$import_id" ] || [ "$import_id" = "None" ]; then
              return
            fi

            if state_has "$address"; then
              return
            fi

            terraform import "$address" "$import_id" || true
          }

          import_route_if_exists() {
            local address="$1"
            local route_key="$2"
            local route_id

            route_id=$(aws apigatewayv2 get-routes \
              --api-id "$api_id" \
              --query "Items[?RouteKey=='$route_key'] | [0].RouteId" \
              --output text)

            if [ -n "$route_id" ] && [ "$route_id" != "None" ]; then
              import_if_missing "$address" "$api_id/$route_id"
            fi
          }

          if [ "${TF_VAR_env_suffix:-dev}" = "prod" ]; then
            resource_suffix=""
          else
            resource_suffix="-${TF_VAR_env_suffix}"
          fi

          api_name="vyracare-api-authentication${resource_suffix}"
          lambda_name="${TF_VAR_lambda_function_name}"
          role_name="vyracare-lambda-exec${resource_suffix}"
          policy_name="vyracare-lambda-secrets-manager${resource_suffix}"
          user_pool_name="vyracare-user-pool${resource_suffix}"
          user_pool_client_name="vyracare-spa-client${resource_suffix}"
          policy_arn="arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

          if aws iam get-role --role-name "$role_name" >/dev/null 2>&1; then
            import_if_missing aws_iam_role.lambda_exec "$role_name"
            import_if_missing aws_iam_role_policy_attachment.lambda_logs "$role_name/$policy_arn"
            import_if_missing aws_iam_role_policy.lambda_secrets_manager "$role_name:$policy_name"
          fi

          if aws lambda get-function --function-name "$lambda_name" >/dev/null 2>&1; then
            import_if_missing aws_lambda_function.auth_api "$lambda_name"

            if aws lambda get-alias --function-name "$lambda_name" --name "live" >/dev/null 2>&1; then
              import_if_missing aws_lambda_alias.auth_api_live "$lambda_name/live"
            fi
          fi

          log_group_name="/aws/lambda/${lambda_name}"
          log_group_exists=$(aws logs describe-log-groups \
            --log-group-name-prefix "$log_group_name" \
            --query "logGroups[?logGroupName=='${log_group_name}'].logGroupName | [0]" \
            --output text)

          if [ "$log_group_exists" = "$log_group_name" ]; then
            import_if_missing aws_cloudwatch_log_group.lambda_logs "$log_group_name"
          fi

          user_pool_id=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='${user_pool_name}'] | [0].Id" \
            --output text)
          if [ -n "$user_pool_id" ] && [ "$user_pool_id" != "None" ]; then
            import_if_missing aws_cognito_user_pool.user_pool "$user_pool_id"

            user_pool_client_id=$(aws cognito-idp list-user-pool-clients \
              --user-pool-id "$user_pool_id" \
              --max-results 60 \
              --query "UserPoolClients[?ClientName=='${user_pool_client_name}'] | [0].ClientId" \
              --output text)

            if [ -n "$user_pool_client_id" ] && [ "$user_pool_client_id" != "None" ]; then
              import_if_missing aws_cognito_user_pool_client.app_client "$user_pool_id/$user_pool_client_id"
            fi
          fi

          api_id=$(aws apigatewayv2 get-apis --query "Items[?Name=='${api_name}'] | [0].ApiId" --output text)
          if [ -n "$api_id" ] && [ "$api_id" != "None" ]; then
            import_if_missing aws_apigatewayv2_api.http_api "$api_id"
            import_if_missing aws_apigatewayv2_stage.default "$api_id/\$default"

            integration_id=$(aws apigatewayv2 get-integrations \
              --api-id "$api_id" \
              --query "Items[0].IntegrationId" \
              --output text)
            if [ -n "$integration_id" ] && [ "$integration_id" != "None" ]; then
              import_if_missing aws_apigatewayv2_integration.lambda_integration "$api_id/$integration_id"
            fi

            authorizer_id=$(aws apigatewayv2 get-authorizers \
              --api-id "$api_id" \
              --query "Items[?Name=='jwt-authorizer'] | [0].AuthorizerId" \
              --output text)
            if [ -n "$authorizer_id" ] && [ "$authorizer_id" != "None" ]; then
              import_if_missing aws_apigatewayv2_authorizer.jwt "$api_id/$authorizer_id"
            fi

            import_route_if_exists aws_apigatewayv2_route.auth_login "POST /api/auth/login"
            import_route_if_exists aws_apigatewayv2_route.auth_register "POST /api/auth/register"
            import_route_if_exists aws_apigatewayv2_route.auth_first_access_check "POST /api/auth/first-access/check"
            import_route_if_exists aws_apigatewayv2_route.auth_first_access_set_password "POST /api/auth/first-access/set-password"
            import_route_if_exists aws_apigatewayv2_route.auth_forgot_password "POST /api/auth/forgot-password"
          fi


      - name: Terraform Plan
        working-directory: ./infra-repo/infra
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra-repo/infra
        run: terraform apply -auto-approve tfplan

      - name: Export API Gateway URL
        working-directory: ./infra-repo/infra
        run: |
          set -euo pipefail
          api_url=$(terraform output -raw api_gateway_url)
          api_id=$(echo "$api_url" | sed -E 's#https://([^.]*)\\.execute-api\\..*#\\1#')
          echo "API_GATEWAY_URL=$api_url" >> $GITHUB_ENV
          echo "API_GATEWAY_ID=$api_id" >> $GITHUB_ENV

      - name: Carregar configuracao do MFE consumidor
        id: consumer_mfe_config
        working-directory: ./backend
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          config_path = Path(".vyracare/mfe-consumer.json")

          enabled = "false"
          repository = ""
          api_url_property = "apiUrl"
          environment_files = ""
          environment_properties_json = "{}"

          if config_path.exists():
            data = json.loads(config_path.read_text(encoding="utf-8"))
            config = data.get("consumerMfe") or {}
            repository = (config.get("repositoryFullName") or "").strip()
            api_url_property = (config.get("apiUrlProperty") or "apiUrl").strip() or "apiUrl"
            environment_properties = config.get("environmentProperties") or {}
            files = [
              str(item).strip()
              for item in (config.get("environmentFiles") or [])
              if str(item).strip()
            ]

            if repository:
              enabled = "true"
              environment_files = ";".join(files or ["src/environments/environments.ts"])
              environment_properties_json = json.dumps(environment_properties)

          with output_path.open("a", encoding="utf-8") as output:
            output.write(f"enabled={enabled}\n")
            output.write(f"repository={repository}\n")
            output.write(f"api_url_property={api_url_property}\n")
            output.write(f"environment_files={environment_files}\n")
            output.write(f"environment_properties_json={environment_properties_json}\n")
          PY

      - name: Resolve MFE consumidor ref
        if: steps.consumer_mfe_config.outputs.enabled == 'true'
        id: resolve_consumer_mfe_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const repositoryFullName = process.env.TARGET_REPOSITORY;
            const branch = process.env.BRANCH_NAME;
            const [owner, repo] = repositoryFullName.split('/');

            if (!branch) {
              core.setOutput('ref', '');
              return;
            }

            const isReleaseBranch = branch === 'release' || branch.startsWith('release/');

            try {
              await github.rest.repos.getBranch({
                owner,
                repo,
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                if (isReleaseBranch) {
                  core.info(`Branch ${branch} not found in ${repositoryFullName}. Skipping consumer update for HML.`);
                  core.setOutput('ref', '__skip__');
                } else {
                  core.info(`Branch ${branch} not found in ${repositoryFullName}. Falling back to default branch.`);
                  core.setOutput('ref', '');
                }
              } else {
                throw error;
              }
            }
        env:
          TARGET_REPOSITORY: ${{ steps.consumer_mfe_config.outputs.repository }}
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout MFE consumidor (branch)
        if: steps.consumer_mfe_config.outputs.enabled == 'true' && steps.resolve_consumer_mfe_ref.outputs.ref != '' && steps.resolve_consumer_mfe_ref.outputs.ref != '__skip__'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.consumer_mfe_config.outputs.repository }}
          ref: ${{ steps.resolve_consumer_mfe_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: consumer-mfe

      - name: Checkout MFE consumidor (default)
        if: steps.consumer_mfe_config.outputs.enabled == 'true' && steps.resolve_consumer_mfe_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.consumer_mfe_config.outputs.repository }}
          token: ${{ secrets.PAT_TOKEN }}
          path: consumer-mfe

      - name: Atualizar URL da API no MFE consumidor
        if: steps.consumer_mfe_config.outputs.enabled == 'true' && steps.resolve_consumer_mfe_ref.outputs.ref != '__skip__'
        working-directory: ./consumer-mfe
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          api_url = os.environ["API_GATEWAY_URL"].rstrip("/") + "/api/auth"
          property_name = os.environ["API_URL_PROPERTY"]
          file_paths = [item for item in os.environ["ENVIRONMENT_FILES"].split(";") if item]
          raw_environment_properties = os.environ.get("ENVIRONMENT_PROPERTIES_JSON", "{}").strip() or "{}"
          branch_name = os.environ.get("BRANCH_NAME", "").strip()

          if not file_paths:
            raise SystemExit("Nenhum arquivo de ambiente configurado para o MFE consumidor.")

          updated_files = []
          created_files = []
          environment_properties = json.loads(raw_environment_properties)

          if not isinstance(environment_properties, dict):
            raise SystemExit("environmentProperties deve ser um objeto JSON no metadata do consumerMfe.")

          def resolve_property_value(value: str) -> str:
            resolved = str(value)
            resolved = resolved.replace("{{API_GATEWAY_URL}}", os.environ["API_GATEWAY_URL"].rstrip("/"))
            resolved = resolved.replace("{{API_GATEWAY_ID}}", os.environ["API_GATEWAY_ID"].strip())
            resolved = resolved.replace("{{PUBLISHED_API_URL}}", api_url)
            return resolved

          resolved_properties = {
            str(key).strip(): resolve_property_value(value)
            for key, value in environment_properties.items()
            if str(key).strip()
          }

          resolved_properties[property_name] = api_url

          def resolve_target_paths(paths: list[str]) -> list[str]:
            if branch_name == "main":
              preferred = [item for item in paths if item.endswith(".prod.ts")]
            elif branch_name == "release" or branch_name.startswith("release/"):
              preferred = [item for item in paths if item.endswith(".hml.ts")]
            else:
              preferred = [item for item in paths if not item.endswith(".prod.ts") and not item.endswith(".hml.ts")]

            return preferred or paths

          def build_environment_file(is_production: bool) -> str:
            property_lines = []
            for key, value in resolved_properties.items():
              if key == "api_id":
                property_lines.append(f'  {key}: "{value}"')
              else:
                property_lines.append(f"  {key}: '{value}'")

            lines = [f"  production: {'true' if is_production else 'false'},"]
            for index, line in enumerate(property_lines):
              suffix = "," if index < len(property_lines) - 1 else ""
              lines.append(line + suffix)
            return "export const environment = {\n" + "\n".join(lines) + "\n};\n"

          def property_pattern(key: str) -> str:
            return rf"(?m)^[ \t]*{re.escape(key)}:\s*(?:'[^']*'|\"[^\"]*\")\s*,?\s*$\n?"

          def get_property_value(text: str, key: str) -> str | None:
            match = re.search(rf"{re.escape(key)}:\s*'([^']*)'", text)
            if match:
              return match.group(1)

            match = re.search(rf'{re.escape(key)}:\s*"([^"]*)"', text)
            if match:
              return match.group(1)

            return None

          def count_property_occurrences(text: str, key: str) -> int:
            return len(re.findall(property_pattern(key), text))

          def remove_property_occurrences(text: str, key: str) -> str:
            return re.sub(property_pattern(key), "", text)

          def upsert_property(text: str, key: str, value: str) -> str:
            cleaned_text = remove_property_occurrences(text, key).rstrip()
            serialized = f'  {key}: "{value}"' if key == "api_id" else f"  {key}: '{value}'"

            if re.search(r"export const environment\s*=\s*\{", cleaned_text) and re.search(r"\n\};\s*$", cleaned_text):
              body_match = re.search(r"export const environment\s*=\s*\{\n?(.*)\n\};\s*$", cleaned_text + "\n", re.S)
              if body_match:
                body_lines = [
                  line.rstrip().rstrip(",")
                  for line in body_match.group(1).splitlines()
                  if line.strip()
                ]
                body_lines.append(serialized)
                normalized_body = "\n".join(
                  line + ("," if index < len(body_lines) - 1 else "")
                  for index, line in enumerate(body_lines)
                )
                return "export const environment = {\n" + normalized_body + "\n};\n"

            return build_environment_file(".prod." in path.name or ".hml." in path.name)

          target_paths = resolve_target_paths(file_paths)

          for file_path in target_paths:
            path = Path(file_path)
            desired_values = {**resolved_properties}

            if not path.exists():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                build_environment_file(".prod." in path.name or ".hml." in path.name),
                encoding="utf-8"
              )
              created_files.append(file_path)
              updated_files.append(file_path)
              continue

            text = path.read_text(encoding="utf-8")
            needs_update = False

            for key, desired_value in desired_values.items():
              if get_property_value(text, key) != desired_value or count_property_occurrences(text, key) != 1:
                needs_update = True
                break

            if not needs_update:
              continue

            updated = text
            for key, desired_value in desired_values.items():
              updated = upsert_property(updated, key, desired_value)

            if updated != text:
              path.write_text(updated, encoding="utf-8")
              updated_files.append(file_path)

          if created_files:
            print("Arquivos criados:", ", ".join(created_files))

          print("Arquivos atualizados:", ", ".join(updated_files) if updated_files else "nenhum")
          PY

          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: atualiza url da api consumida"
            git push
          else
            echo "MFE consumidor ja esta atualizado."
          fi
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}
          API_URL_PROPERTY: ${{ steps.consumer_mfe_config.outputs.api_url_property }}
          ENVIRONMENT_FILES: ${{ steps.consumer_mfe_config.outputs.environment_files }}
          ENVIRONMENT_PROPERTIES_JSON: ${{ steps.consumer_mfe_config.outputs.environment_properties_json }}

      - name: Resolve app-user-mfe ref
        id: resolve_app_user_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            const isReleaseBranch = branch === 'release' || branch.startsWith('release/');

            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-app-user-mfe',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                if (isReleaseBranch) {
                  core.info(`Branch ${branch} not found in vyracare/vyracare-app-user-mfe. Skipping app-user update for HML.`);
                  core.setOutput('ref', '__skip__');
                } else {
                  core.info(`Branch ${branch} not found in vyracare/vyracare-app-user-mfe. Falling back to default branch.`);
                  core.setOutput('ref', '');
                }
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout App User MFE (branch)
        if: steps.resolve_app_user_ref.outputs.ref != '' && steps.resolve_app_user_ref.outputs.ref != '__skip__'
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-user-mfe
          ref: ${{ steps.resolve_app_user_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: app-user-mfe

      - name: Checkout App User MFE (default)
        if: steps.resolve_app_user_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-user-mfe
          token: ${{ secrets.PAT_TOKEN }}
          path: app-user-mfe

      - name: Update App User MFE apiUrl
        if: steps.resolve_app_user_ref.outputs.ref != '__skip__'
        working-directory: ./app-user-mfe
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          api_url = os.environ["API_GATEWAY_URL"].rstrip("/") + "/api/auth"
          branch_name = os.environ.get("BRANCH_NAME", "").strip()

          if branch_name == "main":
            target_files = ("src/environments/environments.prod.ts",)
          elif branch_name == "release" or branch_name.startswith("release/"):
            target_files = ("src/environments/environments.hml.ts",)
          else:
            target_files = ("src/environments/environments.ts",)

          for file_name in target_files:
            path = Path(file_name)
            if not path.exists():
              continue

            text = path.read_text(encoding="utf-8")
            updated = re.sub(r"authApiUrl:\s*'[^']*'", f"authApiUrl: '{api_url}'", text)

            if updated != text:
              path.write_text(updated, encoding="utf-8")
          PY

          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
