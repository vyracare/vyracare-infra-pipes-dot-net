name: CD - Auth - Deploy Terraform

on:
  workflow_call:
    inputs:
      branch-name:
        description: "Branch do backend que disparou o deploy"
        required: true
        type: string
      backend-repo:
        description: "owner/repo do backend (ex: vyracare/vyracare-api-authentication)"
        required: true
        type: string
      project-path:
        description: "Caminho do .csproj no repo do backend"
        required: true
        type: string
      output-dir:
        description: "Diretório de saída do publish (relativo ao workspace do job)"
        required: false
        default: backend-publish
        type: string
      recreate-infra:
        description: "Destruir e recriar a arquitetura de API Gateway e Lambda antes do deploy"
        required: false
        default: false
        type: boolean
      api-id:
        description: "API Gateway ID existente para reutilizar"
        required: false
        default: ""
        type: string
      authorizer-id:
        description: "Authorizer ID existente (jwt-authorizer)"
        required: false
        default: ""
        type: string
      route-id-auth-login:
        description: "Route ID existente para POST /api/auth/login"
        required: false
        default: ""
        type: string
      route-id-auth-register:
        description: "Route ID existente para POST /api/auth/register"
        required: false
        default: ""
        type: string
      route-id-auth-first-access-check:
        description: "Route ID existente para POST /api/auth/first-access/check"
        required: false
        default: ""
        type: string
      route-id-auth-first-access-set-password:
        description: "Route ID existente para POST /api/auth/first-access/set-password"
        required: false
        default: ""
        type: string
      route-id-auth-forgot-password:
        description: "Route ID existente para POST /api/auth/forgot-password"
        required: false
        default: ""
        type: string
    secrets:
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_REGION: { required: false }
      PAT_TOKEN: { required: true }

jobs:
  deploy-terraform:
    runs-on: ubuntu-latest
    # ✅ Apenas UM bloco env no nível do job
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Resolve checkout ref
        id: resolve_checkout_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-infra-pipes-dot-net',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} not found in vyracare/vyracare-infra-pipes-dot-net. Falling back to default branch.`);
                core.setOutput('ref', '');
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout Infra (branch)
        if: steps.resolve_checkout_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          ref: ${{ steps.resolve_checkout_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Infra (default)
        if: steps.resolve_checkout_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Backend at ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs['backend-repo'] }}
          ref: ${{ inputs['branch-name'] }}
          token: ${{ secrets.PAT_TOKEN }}
          path: backend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "backend/${{ inputs['project-path'] }}"

      - name: Build
        run: dotnet build "backend/${{ inputs['project-path'] }}" -c Release --no-restore

      - name: Publish (linux-x64)
        run: |
          mkdir -p "${{ inputs['output-dir'] }}"
          dotnet publish "backend/${{ inputs['project-path'] }}" -c Release -r linux-x64 --self-contained false -o "${{ inputs['output-dir'] }}"

      - name: Export publish dir to TF_VAR
        run: echo "TF_VAR_lambda_source_dir=${GITHUB_WORKSPACE}/${{ inputs['output-dir'] }}" >> $GITHUB_ENV

      - name: Export API Gateway IDs to TF_VAR
        run: |
          set -euo pipefail
          if [ -n "${{ inputs['api-id'] }}" ]; then
            echo "TF_VAR_api_id=${{ inputs['api-id'] }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs['authorizer-id'] }}" ]; then
            echo "TF_VAR_authorizer_id=${{ inputs['authorizer-id'] }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs['route-id-auth-login'] }}" ]; then
            echo "TF_VAR_route_id_auth_login=${{ inputs['route-id-auth-login'] }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs['route-id-auth-register'] }}" ]; then
            echo "TF_VAR_route_id_auth_register=${{ inputs['route-id-auth-register'] }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs['route-id-auth-first-access-check'] }}" ]; then
            echo "TF_VAR_route_id_auth_first_access_check=${{ inputs['route-id-auth-first-access-check'] }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs['route-id-auth-first-access-set-password'] }}" ]; then
            echo "TF_VAR_route_id_auth_first_access_set_password=${{ inputs['route-id-auth-first-access-set-password'] }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs['route-id-auth-forgot-password'] }}" ]; then
            echo "TF_VAR_route_id_auth_forgot_password=${{ inputs['route-id-auth-forgot-password'] }}" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.2

      - name: Terraform Init
        working-directory: ./infra-repo/infra
        run: terraform init

      - name: Terraform Destroy (Gateway + Lambda)
        if: ${{ inputs.recreate-infra }}
        working-directory: ./infra-repo/infra
        run: |
          targets=$(terraform state list | grep -E '^(aws_apigatewayv2_|aws_lambda_|aws_cloudwatch_log_group\\.lambda_logs$|aws_iam_role\\.lambda_exec$|aws_iam_role_policy_attachment\\.lambda_logs$)' || true)
          if [ -z "$targets" ]; then
            echo "No gateway/lambda resources found in state."
            exit 0
          fi
          args=()
          while read -r t; do
            args+=("-target=$t")
          done <<< "$targets"
          terraform destroy -auto-approve "${args[@]}"


      - name: Terraform Plan
        working-directory: ./infra-repo/infra
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra-repo/infra
        run: terraform apply -auto-approve tfplan
