name: CD - Generic - Deploy Terraform

on:
  workflow_call:
    inputs:
      branch-name:
        description: "Branch do backend que disparou o deploy"
        required: true
        type: string
      backend-repo:
        description: "owner/repo do backend"
        required: true
        type: string
      project-path:
        description: "Caminho do .csproj no repo do backend"
        required: true
        type: string
      output-dir:
        description: "Diretório de saída do publish"
        required: false
        default: backend-publish
        type: string
      infra-directory:
        description: "Diretório Terraform genérico no repo de infra"
        required: false
        default: infra-generic
        type: string
      api-gateway-name:
        description: "Nome base do API Gateway"
        required: true
        type: string
      lambda-function-name:
        description: "Nome da função Lambda"
        required: true
        type: string
      lambda-handler:
        description: "Handler/assembly .NET da Lambda"
        required: true
        type: string
      route-base-path:
        description: "Base path da API no API Gateway sem barra inicial (ex: api/catalog)"
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_REGION: { required: false }
      PAT_TOKEN: { required: true }

jobs:
  deploy-terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Resolve checkout ref
        id: resolve_checkout_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-infra-pipes-dot-net',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} not found in vyracare/vyracare-infra-pipes-dot-net. Falling back to default branch.`);
                core.setOutput('ref', '');
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout Infra (branch)
        if: steps.resolve_checkout_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          ref: ${{ steps.resolve_checkout_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Infra (default)
        if: steps.resolve_checkout_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-infra-pipes-dot-net
          token: ${{ secrets.PAT_TOKEN }}
          path: infra-repo

      - name: Checkout Backend at ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs['backend-repo'] }}
          ref: ${{ inputs['branch-name'] }}
          token: ${{ secrets.PAT_TOKEN }}
          path: backend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "backend/${{ inputs['project-path'] }}"

      - name: Build
        run: dotnet build "backend/${{ inputs['project-path'] }}" -c Release --no-restore

      - name: Publish (linux-x64)
        run: |
          mkdir -p "${{ inputs['output-dir'] }}"
          dotnet publish "backend/${{ inputs['project-path'] }}" -c Release -r linux-x64 --self-contained false -o "${{ inputs['output-dir'] }}"

      - name: Export Terraform vars
        run: |
          echo "TF_VAR_lambda_source_dir=${GITHUB_WORKSPACE}/${{ inputs['output-dir'] }}" >> $GITHUB_ENV
          echo "TF_VAR_api_gateway_name=${{ inputs['api-gateway-name'] }}" >> $GITHUB_ENV
          echo "TF_VAR_lambda_function_name=${{ inputs['lambda-function-name'] }}" >> $GITHUB_ENV
          echo "TF_VAR_lambda_handler=${{ inputs['lambda-handler'] }}" >> $GITHUB_ENV
          echo "TF_VAR_route_base_path=${{ inputs['route-base-path'] }}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.2

      - name: Terraform Init
        working-directory: ./infra-repo/${{ inputs['infra-directory'] }}
        run: terraform init

      - name: Importar infraestrutura existente para o state
        working-directory: ./infra-repo/${{ inputs['infra-directory'] }}
        run: |
          set -euo pipefail

          state_list="$(terraform state list 2>/dev/null || true)"

          state_has() {
            echo "$state_list" | grep -qx "$1"
          }

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if [ -z "$import_id" ] || [ "$import_id" = "None" ]; then
              return
            fi

            if state_has "$address"; then
              return
            fi

            terraform import "$address" "$import_id" || true
          }

          import_route_if_exists() {
            local address="$1"
            local route_key="$2"
            local route_id

            route_id=$(aws apigatewayv2 get-routes \
              --api-id "$api_id" \
              --query "Items[?RouteKey=='$route_key'] | [0].RouteId" \
              --output text)

            if [ -n "$route_id" ] && [ "$route_id" != "None" ]; then
              import_if_missing "$address" "$api_id/$route_id"
            fi
          }

          env_suffix="${TF_VAR_env_suffix:-dev}"
          api_name="${{ inputs['api-gateway-name'] }}-${env_suffix}"
          lambda_name="${{ inputs['lambda-function-name'] }}"
          role_name="${lambda_name}-exec"
          policy_arn="arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

          if aws iam get-role --role-name "$role_name" >/dev/null 2>&1; then
            import_if_missing aws_iam_role.lambda_exec "$role_name"
            import_if_missing aws_iam_role_policy_attachment.lambda_logs "$role_name/$policy_arn"
          fi

          if aws lambda get-function --function-name "$lambda_name" >/dev/null 2>&1; then
            import_if_missing aws_lambda_function.backend_api "$lambda_name"

            if aws lambda get-alias --function-name "$lambda_name" --name "live" >/dev/null 2>&1; then
              import_if_missing aws_lambda_alias.backend_api_live "$lambda_name/live"
            fi
          fi

          log_group_name="/aws/lambda/${lambda_name}"
          log_group_exists=$(aws logs describe-log-groups \
            --log-group-name-prefix "$log_group_name" \
            --query "logGroups[?logGroupName=='${log_group_name}'].logGroupName | [0]" \
            --output text)

          if [ "$log_group_exists" = "$log_group_name" ]; then
            import_if_missing aws_cloudwatch_log_group.lambda_logs "$log_group_name"
          fi

          api_id=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${api_name}'] | [0].ApiId" \
            --output text)

          if [ -n "$api_id" ] && [ "$api_id" != "None" ]; then
            import_if_missing aws_apigatewayv2_api.http_api "$api_id"
            import_if_missing aws_apigatewayv2_stage.default "$api_id/\$default"

            integration_id=$(aws apigatewayv2 get-integrations \
              --api-id "$api_id" \
              --query "Items[0].IntegrationId" \
              --output text)

            if [ -n "$integration_id" ] && [ "$integration_id" != "None" ]; then
              import_if_missing aws_apigatewayv2_integration.lambda_integration "$api_id/$integration_id"
            fi

            import_route_if_exists aws_apigatewayv2_route.api_root "ANY /${{ inputs['route-base-path'] }}"
            import_route_if_exists aws_apigatewayv2_route.api_proxy "ANY /${{ inputs['route-base-path'] }}/{proxy+}"
            import_route_if_exists aws_apigatewayv2_route.swagger_root "ANY /swagger"
            import_route_if_exists aws_apigatewayv2_route.swagger_proxy "ANY /swagger/{proxy+}"
            import_route_if_exists aws_apigatewayv2_route.health "GET /health"
          fi

      - name: Terraform Plan
        working-directory: ./infra-repo/${{ inputs['infra-directory'] }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra-repo/${{ inputs['infra-directory'] }}
        run: terraform apply -auto-approve tfplan

      - name: Export API Gateway URL
        working-directory: ./infra-repo/${{ inputs['infra-directory'] }}
        run: |
          set -euo pipefail
          api_url=$(terraform output -raw api_gateway_url)
          swagger_url=$(terraform output -raw swagger_url)
          echo "API_GATEWAY_URL=$api_url" >> $GITHUB_ENV
          echo "SWAGGER_URL=$swagger_url" >> $GITHUB_ENV

      - name: Exibir URLs publicadas
        run: |
          echo "API publicada em: $API_GATEWAY_URL"
          echo "Swagger publicado em: $SWAGGER_URL"

      - name: Resolve app-user-mfe ref
        if: inputs['backend-repo'] == 'vyracare/vyracare-api-client'
        id: resolve_app_user_ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branch = process.env.BRANCH_NAME;
            if (!branch) {
              core.setOutput('ref', '');
              return;
            }
            try {
              await github.rest.repos.getBranch({
                owner: 'vyracare',
                repo: 'vyracare-app-user-mfe',
                branch,
              });
              core.setOutput('ref', branch);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} not found in vyracare/vyracare-app-user-mfe. Falling back to default branch.`);
                core.setOutput('ref', '');
              } else {
                throw error;
              }
            }
        env:
          BRANCH_NAME: ${{ inputs['branch-name'] }}

      - name: Checkout App User MFE (branch)
        if: inputs['backend-repo'] == 'vyracare/vyracare-api-client' && steps.resolve_app_user_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-user-mfe
          ref: ${{ steps.resolve_app_user_ref.outputs.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: app-user-mfe

      - name: Checkout App User MFE (default)
        if: inputs['backend-repo'] == 'vyracare/vyracare-api-client' && steps.resolve_app_user_ref.outputs.ref == ''
        uses: actions/checkout@v4
        with:
          repository: vyracare/vyracare-app-user-mfe
          token: ${{ secrets.PAT_TOKEN }}
          path: app-user-mfe

      - name: Atualizar clientApiUrl no App User MFE
        if: inputs['backend-repo'] == 'vyracare/vyracare-api-client'
        working-directory: ./app-user-mfe
        run: |
          set -euo pipefail
          client_api_url="${API_GATEWAY_URL}/api/client"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          client_api_url = os.environ["API_GATEWAY_URL"].rstrip("/") + "/api/client"
          path = Path("src/environments/environments.ts")
          text = path.read_text()
          text = re.sub(r"clientApiUrl:\s*'[^']*'", f"clientApiUrl: '{client_api_url}'", text)
          path.write_text(text)
          PY

          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/environments/environments.ts
            git commit -m "chore: update client api url"
            git push
          else
            echo "App User MFE ja esta atualizado."
          fi
